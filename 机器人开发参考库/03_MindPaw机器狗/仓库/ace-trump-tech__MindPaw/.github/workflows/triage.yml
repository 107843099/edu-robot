name: Issue triage

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = {
              'needs-triage': ['fbca04', 'Maintainer has not verified the report yet'],
              'needs-more-info': ['d93f0b', 'Report needs reproducible evidence'],
              'bug': ['d73a4a', 'Reproducible hardware or software defect'],
              'hardware': ['5319e7', 'Wiring, PCB, power, or mechanical change'],
              'feature': ['0e8a16', 'Feature or research proposal']
            };
            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name, color, description});
              }
            }
            const title = context.payload.issue.title.toLowerCase();
            const type = title.match(/^\[(bug|hardware|feature)\]/)?.[1];
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['needs-triage', ...(type ? [type] : [])]});
