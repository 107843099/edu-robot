name: Firmware build

on:
  push:
    branches: [main]
    paths:
      - "MindPaw_main/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "MindPaw_main/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Compile firmware
        run: pio run --project-dir MindPaw_main
