name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project manifest and Python syntax
        run: |
          python3 scripts/validate_project.py
          python3 -m compileall -q ai-infra MindPaw_main/tools
      - name: Check whitespace
        run: git diff --check
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v

  recon-tests:                       # 2.0: 流式 3D 重建感知层单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s recon/tests -p 'test_pipeline.py' -v
