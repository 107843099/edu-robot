<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>神秘小彩蛋</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #2d1b2e 0%, #1a1a2e 40%, #16213e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        .petal::before {
            content: '🌸';
            font-size: 16px;
            display: block;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.7; }
            100% { transform: translateY(110vh) translateX(80px) rotate(720deg); opacity: 0; }
        }

        .egg-box {
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 40px 40px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            border: 1px solid rgba(255,182,193,0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,182,193,0.1);
            position: relative;
            z-index: 2;
        }

        .star-icon {
            font-size: 40px;
            margin-bottom: 10px;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .egg-title {
            color: rgba(255,182,193,0.6);
            font-size: 14px;
            margin: 5px 0 30px 0;
            letter-spacing: 3px;
        }

        .text-line1 {
            color: rgba(255,182,193,0.9);
            font-size: 26px;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 3px;
        }

        .progress-bar-bg {
            width: 80%;
            height: 14px;
            background: rgba(255,182,193,0.1);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 8%;
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4, #ffb6c1);
            border-radius: 10px;
            animation: shimmer 2.5s ease-in-out infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .text-line2 {
            color: rgba(255,182,193,0.7);
            font-size: 22px;
            margin: 10px 0 30px 0;
            letter-spacing: 2px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 36px;
            color: rgba(255,182,193,0.3);
            border: 1px solid rgba(255,182,193,0.12);
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.4s;
        }

        .back-btn:hover {
            color: #ffb6c1;
            border-color: rgba(255,182,193,0.4);
        }
    </style>
</head>
<body>
    <div class="petal-container" id="petalContainer"></div>

    <script>
        function createPetals() {
            var container = document.getElementById('petalContainer');
            for (var i = 0; i < 20; i++) {
                var petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (6 + Math.random() * 8) + 's';
                petal.style.animationDelay = (Math.random() * 10) + 's';
                petal.style.fontSize = (12 + Math.random() * 12) + 'px';
                container.appendChild(petal);
            }
        }
        createPetals();
    </script>

    <div class="egg-box">
        <div class="star-icon">✨</div>
        <div class="egg-title">— 神秘小彩蛋 —</div>
        <div class="text-line1">进度条不足</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
        <div class="text-line2">暂无权限开启</div>
        <a href="./home.html" class="back-btn">🔙 返回主页</a>
    </div>
</body>
</html>
