<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>运动控制</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { text-align: center; }
        button {
            display: inline-block; height: auto; width: auto; margin-top: 20px;
            padding: 10px 20px; background-color: deepskyblue; color: #fff;
            border: none; border-radius: 20px; text-decoration: none; line-height: 2;
            text-align: center; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: skyblue; transform: translateY(2px);
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }
        .button-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-content: center; align-content: center; text-align: center; margin: 20px; }
        .button-grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; justify-content: center; align-content: center; text-align: center; margin: 20px; }
        .button-grid1 { display: grid; border-radius: 20px; grid-template-columns: repeat(1, 1fr); justify-content: center; align-content: center; text-align: center; margin: 10px; }
        .back-btn { background-color: #868e96; }
        .back-btn:hover { background-color: #adb5bd; }
    </style>
    <script>
        function sendCommand(action) {
            fetch(`/${action}`)
                .then(response => response.text())
                .catch(() => alert('发送失败，请检查设备连接'));
        }
    </script>
</head>
<body>
<div class='container'>
    <h1>🏃 运动控制</h1>
    <div class="button-grid1" style="background-color: papayawhip">
        <div class="button-grid1" style="display: flex; justify-content: center;">
            <button onclick="sendCommand('front')">↑ 前进</button>
        </div>
        <div class="button-grid2" style="display: flex; justify-content: center;">
            <button onclick="sendCommand('left')" style="margin-right: 70px">← 左转</button>
            <button onclick="sendCommand('right')" style="margin-left: 70px">→ 右转</button>
        </div>
        <div class="button-grid1" style="display: flex; justify-content: center;">
            <button onclick="sendCommand('back')">↓ 后退</button>
        </div>
        <div class="button-grid3">
            <button onclick="sendCommand('toplefthand')">抬左手</button>
            <button onclick="sendCommand('toprighthand')">抬右手</button>
            <button onclick="sendCommand('sitdown')">坐下</button>
            <button onclick="sendCommand('lie')">趴下</button>
            <button onclick="sendCommand('free')">自由模式开</button>
            <button onclick="sendCommand('offfree')">自由模式关</button>
        </div>
        <div class="button-grid1">
            <button onclick="sendCommand('sleep')">回收</button>
        </div>
    </div>
    <button class="back-btn" onclick="window.location.href='./home.html'">🔙 返回主页</button>
</div>
</body>
</html>
