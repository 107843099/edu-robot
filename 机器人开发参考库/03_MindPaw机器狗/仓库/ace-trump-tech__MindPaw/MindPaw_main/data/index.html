<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>MindPaw</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background-color: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin: 0 0 5px 0;
        }

        h3 {
            color: #666;
            font-size: 16px;
            margin: 0 0 5px 0;
            font-weight: normal;
        }

        p {
            color: #888;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        .input-field {
            width: 80%;
            padding: 14px 20px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 80%;
            padding: 14px 20px;
            margin: 20px 0 10px 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        .hint {
            color: #aaa;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>MindPaw 控制中心</h1>
        <h3>科研汪汪汪</h3>
        <p>一个耗时将近一月的桌面小玩具</p>
        <p style="color: hotpink; font-size: 18px; margin-bottom: 20px;">愿你天天开心！</p>
        <input type="text" class="input-field" id="usernameInput" placeholder="请输入姓名" autocomplete="off">
        <button class="login-btn" onclick="doLogin()">登 录</button>
        <div class="error-msg" id="errorMsg"></div>
        <div class="hint">✨ 仅限授权用户登录</div>
    </div>

    <script>
        function doLogin() {
            var name = document.getElementById('usernameInput').value.trim();
            if (name === '庹忠曜' || name === '王家丽') {
                window.location.href = './home.html';
            } else {
                document.getElementById('errorMsg').innerText = '姓名错误，请重新输入';
            }
        }

        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                doLogin();
            }
        });
    </script>
</body>
</html>
