; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    ; 异步Web服务器
    ottowinter/ESPAsyncWebServer-esphome @ ^3.3.0
    ; OLED显示屏
    olikraus/U8g2 @ ^2.36.2
    ; JSON解析
    bblanchon/ArduinoJson @ ^7.2.0
    ; NTP时间客户端
    arduino-libraries/NTPClient @ ^3.2.1
    ; OV2640 摄像头模块 (ArduCAM Mini SPI接口)
    ; The old Registry name is unavailable; pin the upstream Arduino library.
    https://github.com/ArduCAM/Arduino.git#066a7ea1ccae4813e9a9b9d04e55f96bb8b4039e
