<rect width="900" height="356" rx="18" fill="#0e0e10"/>
<text x="40" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e6df">Whistle at a glance</text>
<line class="s l0" x1="40" y1="66" x2="860" y2="66" stroke="#232326" stroke-width="1"/>
<g class="s r0">
<text x="40" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">INPUT</text>
<text x="210" y="90" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">16 kHz mono audio, up to 30 seconds in one pass</text>
</g>
<line class="s l1" x1="40" y1="104" x2="860" y2="104" stroke="#232326" stroke-width="1"/>
<g class="s r1">
<text x="40" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">OUTPUT</text>
<text x="210" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">the transcript, the language, per-word times, and the encoder embedding</text>
</g>
<line class="s l2" x1="40" y1="142" x2="860" y2="142" stroke="#232326" stroke-width="1"/>
<g class="s r2">
<text x="40" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">MODEL</text>
<text x="210" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">16.9 MB at 2 to 4 bit: log-mel front end, conv stem, encoder, laddered decoder</text>
</g>
<line class="s l3" x1="40" y1="180" x2="860" y2="180" stroke="#232326" stroke-width="1"/>
<g class="s r3">
<text x="40" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">SHARED</text>
<text x="210" y="204" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">Needle's .cact container, Cactus Quants, SIMD kernels and KV cache</text>
</g>
<line class="s l4" x1="40" y1="218" x2="860" y2="218" stroke="#232326" stroke-width="1"/>
<g class="s r4">
<text x="40" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">LANGUAGES</text>
<text x="210" y="242" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">English, German, French, Spanish, Italian, Dutch and Polish</text>
</g>
<line class="s l5" x1="40" y1="256" x2="860" y2="256" stroke="#232326" stroke-width="1"/>
<g class="s r5">
<text x="40" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">SPEED</text>
<text x="210" y="280" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">11.1 ms to the first token, 1,319 tokens/s, on an Apple M4 Pro CPU</text>
</g>
<line class="s l6" x1="40" y1="294" x2="860" y2="294" stroke="#232326" stroke-width="1"/>
<g class="s r6">
<text x="40" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">LADDER</text>
<text x="210" y="318" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">every decoder depth from 2 layers up is deployable, picked with --audio-depth</text>
</g>
</svg>
